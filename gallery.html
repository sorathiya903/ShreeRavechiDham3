<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Shree Ravechi Dham 3</title>

    <meta
        name="description"
        content="Explore photos and memories from Shree Ravechi Dham 3."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #222;
        }

        /* NAVBAR */

        header {
            background: #ffffff;
            border-bottom: 1px solid #eee2d8;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1150px;
            margin: auto;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #7b4b2a;
        }

        .logo span {
            color: #d97706;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #d97706;
        }

        nav a.active {
            color: #a6531b;
            font-weight: bold;
        }

        /* HERO */

        .hero {
            text-align: center;
            padding: 65px 20px 45px;
            background: linear-gradient(
                180deg,
                #fff7ed,
                #fffaf5
            );
        }

        .hero small {
            color: #d97706;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: 42px;
            margin: 12px 0;
            color: #3f2a1d;
        }

        .hero p {
            max-width: 600px;
            margin: auto;
            color: #777;
            line-height: 1.6;
            font-size: 16px;
        }

        /* FILTERS */

        .filters {
            max-width: 1100px;
            margin: 10px auto 30px;
            padding: 0 20px;

            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: 1px solid #e5d5c7;
            background: white;
            color: #6b5140;

            padding: 9px 18px;
            border-radius: 30px;

            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .filter-btn:hover {
            border-color: #d97706;
            color: #d97706;
        }

        .filter-btn.active {
            background: #d97706;
            color: white;
            border-color: #d97706;
        }

        /* GALLERY */

        .gallery {
            max-width: 1100px;
            margin: auto;
            padding: 0 20px 70px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .gallery-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;

            border: 1px solid #eee2d8;

            box-shadow: 0 4px 15px rgba(80, 50, 30, 0.06);

            transition: transform 0.25s, box-shadow 0.25s;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(80, 50, 30, 0.12);
        }

        .gallery-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .gallery-info {
            padding: 17px;
        }

        .gallery-info h3 {
            margin: 0 0 7px;
            font-size: 18px;
            color: #3f2a1d;
        }

        .category {
            display: inline-block;
            background: #fff1df;
            color: #a6531b;

            padding: 5px 10px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;
        }

        /* EMPTY */

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #888;
        }

        /* FOOTER */

        footer {
            background: #3f2a1d;
            color: #eee;
            text-align: center;
            padding: 35px 20px;
        }

        footer .footer-logo {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        footer p {
            margin: 0;
            color: #cfc3bb;
            font-size: 13px;
        }

        /* MOBILE */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #eee;
}

.nav-container {
    max-width: 1180px;
    margin: auto;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
    color: #222;
    min-width: 0;
}

.logo-icon {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 10px;
    background: #f2e5d9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a542f;
    font-size: 21px;
}

.logo-text {
    font-size: 19px;
    font-weight: 700;
    white-space: nowrap;
}

.logo-text span {
    display: block;
    color: #a8612d;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 27px;
}

.nav-links a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    white-space: nowrap;
    transition: 0.2s;
}

.nav-links a:hover {
    color: #a8612d;
}

.nav-btn {
    background: #754725;
    color: white !important;
    padding: 9px 17px;
    border-radius: 8px;
}

.nav-btn:hover {
    background: #5f381d;
}

.menu-btn {
    display: none;
    border: none;
    background: transparent;
    font-size: 25px;
    cursor: pointer;
    color: #754725;
    padding: 5px;
        }
        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }


            .hero h1 {
                font-size: 34px;
            }
        }

        @media (max-width: 550px) {
            
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-image {
                height: 240px;
            }

            .hero {
                padding: 50px 20px 35px;
            }
        }
        @media (max-width: 850px) {

    .nav-container {
        padding: 13px 18px;
    }

    .menu-btn {
        display: block;
    }

    .nav-links {
        display: none;

        position: absolute;
        top: calc(100% + 1px);
        left: 0;
        right: 0;

        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(12px);

        border-bottom: 1px solid #eaded5;

        padding: 14px 18px 18px;

        flex-direction: column;
        align-items: stretch;

        gap: 4px;

        box-shadow: 0 12px 25px rgba(70, 39, 20, 0.08);
    }

    .nav-links.active {
        display: flex;
    }

    .nav-links a {
        display: block;
        width: 100%;
        padding: 12px 10px;

        font-size: 14px;

        border-radius: 8px;
    }

    .nav-links a:hover {
        background: #fff3e5;
    }

    .nav-links .nav-btn {
        text-align: center;
        margin-top: 5px;
    }
}


@media (max-width: 540px) {

    .nav-container {
        padding: 11px 14px;
    }

    .logo {
        gap: 8px;
    }

    .logo-icon {
        width: 35px;
        height: 35px;
        min-width: 35px;
        font-size: 18px;
    }

    .logo-text {
        font-size: 16px;
    }

    .logo-text span {
        font-size: 9px;
        letter-spacing: 0.7px;
    }

    .menu-btn {
        font-size: 24px;
    }
            }
    </style>
</head>

<body>
<header class="navbar">
    <div class="nav-container">

        <div class="logo">
            <div class="logo-icon">🏠</div>

            <div class="logo-text">
                Shree Ravechi Dham 3
                <span>Our Community</span>
            </div>
        </div>

        <nav class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/notice">Notices</a>
            <a href="/events">Events</a>
            <a href="/gallery">Gallery</a>
            <a href="/contact" class="nav-btn">Contact</a>
        </nav>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>

    </div>
</header>


<section class="hero">

    <small>Our Community</small>

    <h1>Gallery</h1>

    <p>
        Explore moments, celebrations and places
        from the Shree Ravechi Dham 3 community.
    </p>

</section>


<div class="filters" id="filters">
    <button class="filter-btn active" data-category="All">
        All
    </button>
</div>


<section class="gallery" id="galleryContainer"></section>


<footer>

    <div class="footer-logo">
        Shree Ravechi Dham 3
    </div>

    <p>
        Our community, our home.
    </p>

    <p style="margin-top:12px;">
        © 2026 Shree Ravechi Dham 3
    </p>

</footer>


<script src="gallery.js"></script>

<script>

const galleryContainer =
    document.getElementById("galleryContainer");

const filtersContainer =
    document.getElementById("filters");


function getCategories() {

    const categories = [
        ...new Set(
            gallery.map(item => item.category)
        )
    ];

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className = "filter-btn";

        button.textContent = category;

        button.dataset.category = category;

        filtersContainer.appendChild(button);

    });
}


function displayGallery(category = "All") {

    galleryContainer.innerHTML = "";

    const filtered =
        category === "All"
            ? gallery
            : gallery.filter(
                item => item.category === category
            );


    if (filtered.length === 0) {

        galleryContainer.innerHTML = `
            <div class="empty">
                No photos available yet.
            </div>
        `;

        return;
    }


    filtered.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "gallery-card";

        card.innerHTML = `

            <img
                class="gallery-image"
                src="${item.image}"
                alt="${item.title}"
                loading="lazy"
            >

            <div class="gallery-info">

                <h3>${item.title}</h3>

                <span class="category">
                    ${item.category}
                </span>

            </div>
        `;

        galleryContainer.appendChild(card);

    });

}


/* FILTER CLICK */

filtersContainer.addEventListener(
    "click",
    function(e) {

        if (!e.target.classList.contains("filter-btn"))
            return;

        document
            .querySelectorAll(".filter-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        e.target.classList.add("active");

        displayGallery(
            e.target.dataset.category
        );

    }
);


/* INITIALIZE */

getCategories();

displayGallery();
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
    </html>
